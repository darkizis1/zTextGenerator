name: Build (agent branch)

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build zTextGenerator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -x javadoc build

      - name: Collect jar
        run: |
          mkdir -p dist
          find target -maxdepth 1 -name "*.jar" -exec cp -v {} dist/ \;
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zTextGenerator-jar
          path: dist/*.jar
          if-no-files-found: error

      - name: Commit jar to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.jar
          git commit -m "CI: build zTextGenerator jar [skip ci]" || echo "no changes to commit"
          git push
