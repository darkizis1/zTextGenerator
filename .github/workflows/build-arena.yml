name: Build (agent branch)

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build zTextGenerator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Diagnostics
        run: |
          java -version
          for u in https://repo.groupez.dev/releases https://plugins.gradle.org/m2 https://repo1.maven.org/maven2 https://repo.papermc.io/repository/maven-public https://jitpack.io; do
            printf "%s -> " "$u"; curl -s -o /dev/null -m 20 -w "%{http_code}\n" "$u" || echo "fail"
          done

      - name: Build with Gradle
        run: |
          mkdir -p dist
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace -x javadoc build > dist/build.log 2>&1
          echo "gradle-exit=$?" | tee -a dist/build.log
          tail -80 dist/build.log
          exit 0

      - name: Collect jar
        run: |
          find . -maxdepth 2 -name "*.jar" -path "*target*" -exec cp -v {} dist/ \; || true
          ls -la dist || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zTextGenerator-build
          path: dist/*
          if-no-files-found: warn

      - name: Commit results to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "CI: build output [skip ci]" || echo "no changes to commit"
          git push || true
