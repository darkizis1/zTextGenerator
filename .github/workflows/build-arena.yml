name: Build (agent branch)

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build zTextGenerator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Diagnostics
        run: |
          mkdir -p dist
          java -version
          curl -s -m 30 https://maven.devs.beer/dev/lone/api-itemsadder/maven-metadata.xml -o dist/itemsadder-metadata.xml || echo "itemsadder metadata unreachable"
          head -60 dist/itemsadder-metadata.xml 2>/dev/null || true

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace -x javadoc build > dist/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "" >> dist/build.log
            echo "==== retry without the ItemsAdder hook (artifact missing from maven.devs.beer) ====" >> dist/build.log
            ./gradlew --no-daemon --stacktrace -x javadoc -PskipItemsAdder build >> dist/build.log 2>&1
            code=$?
          fi
          echo "gradle-exit=$code" >> dist/build.log
          tail -40 dist/build.log
          exit 0

      - name: Collect jar
        run: |
          find . -maxdepth 2 -name "*.jar" -path "*target*" -exec cp -v {} dist/ \; || true
          ls -la dist || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zTextGenerator-build
          path: dist/*
          if-no-files-found: warn

      - name: Commit results to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "CI: build output [skip ci]" || echo "no changes to commit"
          git push || true
